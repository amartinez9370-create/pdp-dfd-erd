<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDP Diagrams (view only)</title>
<style>
  :root{--bg:#f7f5f0;--ink:#16302f;--line:#cfd8d6;--teal:#1f5f5b;--mist:#e5eeec}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1c1b;--ink:#e6efed;--line:#2c4442;--teal:#6fc2bb;--mist:#183230}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  header h1{font-size:15px;margin:0 8px 0 0;font-weight:700;letter-spacing:.01em}
  button,select,a.btn{font:inherit;color:var(--ink);background:var(--mist);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
  button:hover,select:hover,a.btn:hover{border-color:var(--teal)}
  button:disabled{opacity:.4;cursor:default}
  select{flex:1 1 260px;min-width:0;max-width:640px}
  .sp{flex:1}
  #count{font-size:13px;opacity:.75;white-space:nowrap}
  main{flex:1;min-height:0;position:relative;overflow:hidden}
  #stage{position:absolute;inset:0;overflow:auto;background:#fff}
  #stage .geDiagramContainer{margin:0 auto}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#444;background:#fff;z-index:2}
  footer{font-size:12px;padding:5px 12px;border-top:1px solid var(--line);opacity:.8}
  #stage .geToolbarContainer,#stage .geToolbar{display:none!important}
  #stage .mxgraph{user-select:none;-webkit-user-select:none}
  @media (max-width:640px){header h1{width:100%}}
</style>
</head>
<body>
<header>
  <h1>Paciente Dental POD · DFDs and ERD</h1>
  <button id="prev" type="button" aria-label="Previous diagram">&larr; Prev</button>
  <select id="pick" aria-label="Choose a diagram"></select>
  <button id="next" type="button" aria-label="Next diagram">Next &rarr;</button>
  <span id="count"></span>
  <span class="sp"></span>
  <button id="fit" type="button">Fit</button>
  <button id="full" type="button">Full screen</button>
  <a class="btn" id="all" href="#" target="_blank" rel="noopener">All pages (viewer)</a>
</header>
<main><div id="msg">Loading diagrams&hellip;</div><div id="stage"></div></main>
<footer>View only. Use the arrow keys or the list to change diagram. Mouse wheel to zoom at the pointer, drag to pan. · page v4</footer>

<script>
(function(){
"use strict";
var FILE='pdp-dfd-erd.drawio';
var VIEWER=window.PDP_VIEWER_SRC||'https://viewer.diagrams.net/js/viewer-static.min.js';
var $=function(s){return document.querySelector(s)};
var pages=[],cur=0,curV=null,renderTok=0;
// Only the duplicate landscape copy made for the slide deck is left out of the menu.
function skip(n){return /for deck/i.test(n)}
function pretty(n){return n.replace(/\s+-\s+/,' · ').replace(/Data Flow Diagram \(Level 1\)/,'DFD Level 1').replace(/\s+/g,' ')}
function setMsg(t){var m=$('#msg');if(t){m.textContent=t;m.style.display='flex'}else m.style.display='none'}
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(new Error('viewer script failed'))};document.head.appendChild(s)})}


// Own pan and zoom. Mouse down is captured before draw.io sees it, so dragging
// never selects shapes, even when the drag starts on a shape.
var userMoved=false;
function setView(g,s,tx,ty){g.view.scaleAndTranslate(s,tx,ty)}
function zoomAt(g,mx,my,f){
  var view=g.view,s=view.scale,t=view.translate;
  var ns=Math.max(0.05,Math.min(8,s*f));
  if(ns===s)return;
  var gx=mx/s-t.x,gy=my/s-t.y;            // model point under the pointer
  setView(g,ns,mx/ns-gx,my/ns-gy);        // keep that point under the pointer
  userMoved=true;
}
function enhance(v){
  var g=v.graph,c=g.container;
  userMoved=false;
  c.style.overflow='hidden';
  c.style.cursor='grab';
  c.style.touchAction='none';
  try{g.setTooltips(false)}catch(e){}
  var drag=null;
  function pos(ev){var r=c.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top}}
  c.addEventListener('mousedown',function(ev){
    if(ev.button!==0)return;
    ev.preventDefault();ev.stopPropagation();
    var p=pos(ev);drag={x:p.x,y:p.y};c.style.cursor='grabbing';
  },true);
  window.addEventListener('mousemove',function(ev){
    if(!drag)return;
    var p=pos(ev),t=g.view.translate,s=g.view.scale;
    setView(g,s,t.x+(p.x-drag.x)/s,t.y+(p.y-drag.y)/s);
    drag={x:p.x,y:p.y};userMoved=true;
  });
  window.addEventListener('mouseup',function(){drag=null;c.style.cursor='grab'});
  c.addEventListener('click',function(ev){ev.stopPropagation()},true);
  c.addEventListener('dblclick',function(ev){ev.stopPropagation();ev.preventDefault()},true);
  c.addEventListener('wheel',function(ev){
    ev.preventDefault();ev.stopPropagation();
    var p=pos(ev);
    zoomAt(g,p.x,p.y,Math.exp(-Math.max(-200,Math.min(200,ev.deltaY))*0.0015));
  },{passive:false,capture:true});
  // Touch: one finger pans, two fingers pinch-zoom around their midpoint.
  var tp=null;
  function tinfo(ev){
    var r=c.getBoundingClientRect(),a=ev.touches[0],b=ev.touches[1];
    if(b)return {x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
    return {x:a.clientX-r.left,y:a.clientY-r.top,d:0};
  }
  c.addEventListener('touchstart',function(ev){ev.preventDefault();ev.stopPropagation();tp=tinfo(ev)},{passive:false,capture:true});
  c.addEventListener('touchmove',function(ev){
    ev.preventDefault();ev.stopPropagation();
    if(!tp)return;
    var n=tinfo(ev),t=g.view.translate,s=g.view.scale;
    setView(g,s,t.x+(n.x-tp.x)/s,t.y+(n.y-tp.y)/s);
    if(n.d&&tp.d)zoomAt(g,n.x,n.y,n.d/tp.d);
    tp=n;userMoved=true;
  },{passive:false,capture:true});
  c.addEventListener('touchend',function(ev){ev.preventDefault();tp=ev.touches.length?tinfo(ev):null},{passive:false,capture:true});
}

// Remove any toolbar the hosted viewer script adds (zoom, fit, layers buttons).
function stripToolbars(){
  var st=$('#stage');if(!st)return;
  Array.prototype.forEach.call(st.querySelectorAll('.geToolbarContainer,.geToolbar,.geBigButton,.geButton'),function(e){
    var box=e.closest('.geToolbarContainer')||e.parentNode;
    if(box&&box!==st&&!box.classList.contains('mxgraph'))box.style.display='none';
  });
}

// Fit the whole diagram inside the visible area, centred, with a small margin.
function fitView(force){
  if(!curV)return;
  if(userMoved&&!force)return;
  var g=curV.graph,c=g.container,view=g.view;
  var cw=c.clientWidth,ch=c.clientHeight;
  if(cw<50||ch<50)return;
  var s=view.scale,t=view.translate,b=g.getGraphBounds();
  if(!b||!b.width||!b.height)return;
  var bw=b.width/s,bh=b.height/s,bx=b.x/s-t.x,by=b.y/s-t.y,m=16;
  var ns=Math.min((cw-2*m)/bw,(ch-2*m)/bh,3);
  var tx=-bx+(cw/ns-bw)/2,ty=-by+(ch/ns-bh)/2;
  view.scaleAndTranslate(ns,tx,ty);
  c.scrollLeft=0;c.scrollTop=0;
  if(force)userMoved=false;
}
window.addEventListener('resize',function(){fitView()});
window.__pdpViewer=function(){return curV};

function render(i){
  cur=Math.max(0,Math.min(pages.length-1,i));
  $('#pick').value=String(cur);
  $('#prev').disabled=cur===0;$('#next').disabled=cur===pages.length-1;
  $('#count').textContent=(cur+1)+' / '+pages.length;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
  var st=$('#stage');st.innerHTML='';
  var d=document.createElement('div');d.className='mxgraph';
  d.style.cssText='display:block;position:absolute;left:0;top:0;width:100%;height:100%';
  var cfg={highlight:'#0000ff',nav:true,resize:false,lightbox:false,border:0,
    xml:'<mxfile><diagram name="p" id="p">'+pages[cur].model+'</diagram></mxfile>'};
  d.setAttribute('data-mxgraph',JSON.stringify(cfg));
  st.appendChild(d);
  var myTok=++renderTok;
  window.GraphViewer.createViewerForElement(d,function(v){
    if(myTok!==renderTok)return;
    curV=v;enhance(v);stripToolbars();fitView();
    // The viewer lays itself out a little after creation, so keep refitting until the reader moves the view.
    [30,100,250,500,1000,2000,3500].forEach(function(ms){setTimeout(function(){if(myTok===renderTok){stripToolbars();fitView()}},ms)});
    if(window.ResizeObserver){var ro=new ResizeObserver(function(){if(myTok===renderTok)fitView()});ro.observe(v.graph.container)}
  });
  st.scrollTop=0;st.scrollLeft=0;
}

function init(xmlText){
  var doc=new DOMParser().parseFromString(xmlText,'text/xml');
  var ser=new XMLSerializer();
  Array.prototype.forEach.call(doc.getElementsByTagName('diagram'),function(d,idx){
    var name=d.getAttribute('name')||('Page '+(idx+1));
    if(skip(name))return;
    var m=d.getElementsByTagName('mxGraphModel')[0];if(!m)return;
    pages.push({idx:idx,name:name,model:ser.serializeToString(m)});
  });
  var sel=$('#pick');
  pages.forEach(function(p,k){var o=document.createElement('option');o.value=String(k);o.textContent=pretty(p.name);sel.appendChild(o)});
  sel.addEventListener('change',function(){render(+sel.value)});
  $('#prev').onclick=function(){render(cur-1)};
  $('#next').onclick=function(){render(cur+1)};
  $('#fit').onclick=function(){fitView(true)};
  $('#full').onclick=function(){var e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen()};
  document.addEventListener('keydown',function(ev){
    if(ev.target&&/SELECT|INPUT/.test(ev.target.tagName))return;
    if(ev.key==='ArrowRight'||ev.key==='PageDown')render(cur+1);
    else if(ev.key==='ArrowLeft'||ev.key==='PageUp')render(cur-1);
    else if(ev.key==='Home')render(0);else if(ev.key==='End')render(pages.length-1);
  });
  // Link to the stock draw.io viewer with every page.
  var abs=new URL(FILE,location.href).href;
  $('#all').href='https://viewer.diagrams.net/?lightbox=1&highlight=0000ff&layers=1&nav=1#U'+encodeURIComponent(abs);
  var start=parseInt((location.hash||'').slice(1),10);
  setMsg('');
  render(isNaN(start)?0:start-1);
}

Promise.all([fetch(FILE).then(function(r){if(!r.ok)throw new Error(FILE+' '+r.status);return r.text()}),loadScript(VIEWER)])
.then(function(x){init(x[0])})
.catch(function(e){setMsg('Could not load the diagrams ('+e.message+'). Open the "All pages (viewer)" link or try again.');});
})();
</script>
</body>
</html>
